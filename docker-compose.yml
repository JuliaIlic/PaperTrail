services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-central-1
      DYNAMODB_TABLE: papertrail-history
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8001:8000"
  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-central-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do echo 'Waiting for DynamoDB Local...'; sleep 1; done;
      aws dynamodb describe-table --table-name papertrail-history --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 ||
      aws dynamodb create-table --table-name papertrail-history
      --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=created_at,AttributeType=S
      --key-schema AttributeName=pk,KeyType=HASH AttributeName=created_at,KeyType=RANGE
      --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000 --no-cli-pager"